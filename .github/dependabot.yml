version: 2
updates:
  # Frontend app
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One grouped PR for routine bumps keeps review noise low.
      app-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # All npm majors are deliberate migration work, reviewed via periodic
      # `npm outdated` checks — not bot PRs. Note: this can also suppress
      # security updates that require a major bump; GitHub security alerts
      # still surface these.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Python pipeline
  - package-ecosystem: pip
    directory: /pipeline
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  # GitHub Actions versions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
