name: CI

# Quality gate only — Vercel owns deployment via its GitHub integration.
# Make this workflow a required status check on `main` (branch protection) so
# nothing merges red. Production is therefore test-gated even though Vercel
# itself only runs the build.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repo and reports its own check.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify # <- this exact name is the required status check in ruleset.json
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build
