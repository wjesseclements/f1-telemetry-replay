name: CI

# Quality gate only — Vercel owns deployment via its GitHub integration.
# Make this workflow a required status check on `main` (branch protection) so
# nothing merges red. Production is therefore test-gated even though Vercel
# itself only runs the build.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repo and reports its own check.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify # <- this exact name is the required status check in ruleset.json
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Prettier is wired into the PostToolUse hook and into `npm run check`; without
      # it here the repo and the hook drift apart silently, which is exactly what
      # happened between Slices 4b and 5.
      - run: npm run format:check
      # --coverage enforces the src/engine/** thresholds in vite.config.ts. Without
      # it the bar would only hold on a developer's machine.
      #
      # This also runs `src/data/pipelineContract.test.ts`, which validates the
      # committed pipeline goldens through the app's real `parseReplay` — the
      # schema-conformance half of the pipeline's acceptance test. No network: the
      # goldens are committed JSON.
      - run: npm run test -- --run --coverage
      - run: npm run build

      # --- pipeline -----------------------------------------------------------
      # These live INSIDE `verify` rather than in a job of their own, deliberately.
      # `.github/ruleset.json` names `verify` as the required status check by that
      # exact string, so a separate job would not block a merge until someone edited
      # branch protection — and repo config is applied by scripts/setup-repo.sh, which
      # is the human's job. One required check covers both languages.
      #
      # Only `requirements-dev.txt` is installed: pytest, pytest-cov and numpy. FastF1
      # is deliberately absent, so CI cannot reach the network through the pipeline
      # even by accident.
      #
      # Two interpreters, no job matrix: a matrix would duplicate the whole npm half
      # above to test Python. 3.10 is the floor CLAUDE.md documents; 3.12 is what a
      # human will actually have installed.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pipeline/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: pipeline
      - run: pytest
        working-directory: pipeline

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: pipeline
      - run: pytest
        working-directory: pipeline
