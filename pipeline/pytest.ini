[pytest]
# `pythonpath` puts the pipeline root (for `replay_transform`) and tests/ (for the
# shared `synthetic` fixtures) on sys.path, so the tests import the modules the way
# the pipeline itself does — no package boilerplate, no sys.path hacks in the tests.
pythonpath = . tests
testpaths = tests

# The same bar the app holds its engine to. `app/vite.config.ts` gates
# `src/engine/**` at 90% per file; `replay_transform.py` is the pipeline's engine and
# is gated identically rather than aspirationally (CLAUDE.md "Testing").
#
# Only the pure module is measured. `build_replay.py` cannot run without network, so
# it deliberately holds no logic worth testing — including it would measure a file
# whose coverage is structurally unreachable and turn the gate into noise.
# `--cov-branch` matters for parity: the app's threshold covers branches as well as
# lines, and statement coverage alone would call a half-tested `if` fully covered.
addopts =
    --strict-markers
    --cov=replay_transform
    --cov-branch
    --cov-report=term-missing
    --cov-fail-under=90
