<!--
  Home-screen icon, option A — "corner": the favicon, grown up.

  The favicon's speed-painted corner (app/public/favicon.svg), same path, same
  THERMAL stops, same diagonal gradient, scaled x12 onto a full-bleed token bg square.
  Full bleed because iOS and Android cut their own shape: the art keeps inside the
  maskable safe zone (a centred circle of radius 40%, 205 px of 512) so no launcher
  mask can clip it. Palette values are literal for the favicon's reason: a static
  asset reaches neither the CSS tokens nor the engine.

  One of three proposals in docs/icons/proposals/ (Slice 27; drawn for Slice
  26's draft F). Which one is the app's icon is the human's choice; the live one
  is the copy at docs/icons/app-icon.svg. To swap: copy a proposal over that
  file, run `cd app && npx vite-node ../docs/icons/rasterize-icons.mjs`, and
  commit the SVG with the four PNGs it rewrites. A full-bleed 512 square: iOS
  and Android cut their own shape, and the art keeps inside the maskable safe
  zone (a centred circle of radius 40%, 205 px of 512). Palette values are
  literal for the favicon's reason: a static asset reaches neither the CSS
  tokens nor the engine. If THERMAL or a token is retuned, retune this too and
  re-render.

  (No double hyphen anywhere in this comment: XML forbids it, and the image
  then fails to decode with no other message.)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="thermal" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1e50ff" />
      <stop offset="0.25" stop-color="#18c3ff" />
      <stop offset="0.5" stop-color="#2be08a" />
      <stop offset="0.75" stop-color="#f4e04d" />
      <stop offset="1" stop-color="#ff5630" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#0a0d12" />
  <g transform="translate(256 256) scale(12) translate(-16 -16)">
    <path
      d="M6 25 C 14 25 9 7 18 7 C 25 7 25 17 26 21"
      fill="none"
      stroke="url(#thermal)"
      stroke-width="4.5"
      stroke-linecap="round"
    />
  </g>
</svg>
