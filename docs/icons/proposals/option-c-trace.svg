<!--
  Home-screen icon, option C — "trace": a lap's speed trace, coloured by speed.

  Height IS speed (80 km/h at the bottom line, 340 at the top), and the stroke's
  vertical gradient puts each THERMAL stop at its own km/h — offsets 0, .269, .538,
  .769, 1 — so every point of the line wears exactly the colour the canvas would
  paint at that speed. Accelerate, brake hard into a slow corner, a lift, brake
  again: a lap the app could have drawn. Grid lines in token line, full bleed on
  token bg; inside the maskable safe zone (radius 40%, 205 px of 512).

  One of three proposals in docs/icons/proposals/ (Slice 27; drawn for Slice
  26's draft F). Which one is the app's icon is the human's choice; the live one
  is the copy at docs/icons/app-icon.svg. To swap: copy a proposal over that
  file, run `cd app && npx vite-node ../docs/icons/rasterize-icons.mjs`, and
  commit the SVG with the four PNGs it rewrites. A full-bleed 512 square: iOS
  and Android cut their own shape, and the art keeps inside the maskable safe
  zone (a centred circle of radius 40%, 205 px of 512). Palette values are
  literal for the favicon's reason: a static asset reaches neither the CSS
  tokens nor the engine. If THERMAL or a token is retuned, retune this too and
  re-render.

  (No double hyphen anywhere in this comment: XML forbids it, and the image
  then fails to decode with no other message.)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="speed" gradientUnits="userSpaceOnUse" x1="0" y1="372" x2="0" y2="148">
      <stop offset="0" stop-color="#1e50ff" />
      <stop offset="0.269" stop-color="#18c3ff" />
      <stop offset="0.538" stop-color="#2be08a" />
      <stop offset="0.769" stop-color="#f4e04d" />
      <stop offset="1" stop-color="#ff5630" />
    </linearGradient>
    <path
      id="trace"
      d="M120 303 C150 230 175 170 214 157 C226 153 230 340 240 360 C244 366 247 364 250 360 C266 330 284 240 300 220 C306 214 308 238 314 236 C326 232 338 190 352 183 C360 180 364 300 372 318 C378 330 384 300 392 292"
    />
  </defs>
  <rect width="512" height="512" fill="#0a0d12" />
  <g stroke="#232a34" stroke-width="4" stroke-linecap="round">
    <path d="M104 148 H408" />
    <path d="M104 260 H408" />
    <path d="M104 372 H408" />
  </g>
  <path
    d="M120 303 C150 230 175 170 214 157 C226 153 230 340 240 360 C244 366 247 364 250 360 C266 330 284 240 300 220 C306 214 308 238 314 236 C326 232 338 190 352 183 C360 180 364 300 372 318 C378 330 384 300 392 292 L392 372 L120 372 Z"
    fill="url(#speed)"
    opacity="0.16"
  />
  <use
    href="#trace"
    fill="none"
    stroke="url(#speed)"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
